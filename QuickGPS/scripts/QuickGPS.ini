[Settings]
// Press this key to open/close the QuickGPS menu (names from System.Windows.Forms.Keys).
// You can also change it in game: open the menu, scroll to SETTINGS > Change hotkey, click, press a key.
Hotkey=Tab
// How long to hold the hotkey before the menu opens (seconds, 0 = instant)
HotkeyHoldSeconds=1
// Mouse button that picks the highlighted entry (LButton, RButton, MButton, XButton1, XButton2)
SelectButton=LButton
// Mouse button that closes the menu
CloseButton=RButton
// Flip the mouse wheel direction
InvertScroll=false
// Stop the game seeing the clicks and wheel while the menu is open (no shooting, aiming or
// weapon switching). If this is off, or can't start, Niko's weapon is put away instead.
BlockMouseFromGame=true
// Always put Niko's weapon away while the menu is open
HolsterWeaponWhileOpen=false
// Stop Niko moving while the menu is open (off: he keeps walking and driving)
FreezePlayerWhileOpen=false
// Show distances in ft/mi instead of m/km
UseMiles=false
// Number of rows shown at once (the list scrolls)
MaxVisibleRows=14
// The route is removed automatically when you get this close (metres)
ArriveDistance=25
// Press to write every map blip to scripts\QuickGPS_blips.txt (for troubleshooting)
DebugDumpKey=F9
// Highest blip icon id scanned (raise if some DLC blips are missing)
MaxBlipSprite=255
// Show "GPS: <place>  <distance>  <direction>" in the top-left while a route is set
ShowRouteHint=true
// Controller: hold D-pad left (HotkeyHoldSeconds) to open, D-pad up/down to move, A to pick, B to close
ControllerSupport=true
// Hide those buttons from the game while they're used for the menu (no weapon switch, phone, sprint
// or melee). A quick tap of D-pad left still reaches the game when you let go.
BlockControllerFromGame=true
